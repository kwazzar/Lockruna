name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lockruna
          POSTGRES_PASSWORD: lockruna_password
          POSTGRES_DB: lockruna_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lockruna -d lockruna_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mongodb:
        image: mongo:7-jammy
        env:
          MONGO_INITDB_ROOT_USERNAME: lockruna
          MONGO_INITDB_ROOT_PASSWORD: lockruna_password
          MONGO_INITDB_DATABASE: lockruna_audit_test
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install the Android platform
        run: |
          sdkmanager "platforms;android-37"

      - name: Tests
        env:
          TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/lockruna_test
          TEST_DATABASE_USER: lockruna
          TEST_DATABASE_PASSWORD: lockruna_password
          TEST_MONGODB_URI: mongodb://lockruna:lockruna_password@localhost:27017/lockruna_audit_test?authSource=admin
        run: |
          ./gradlew \
            :api-contract:jvmTest \
            :shared:domain:jvmTest \
            :shared:application:jvmTest \
            :shared:presentation:jvmTest \
            :shared:data:jvmTest \
            :architecture-tests:test \
            :server:test

      - name: Lint
        run: ./gradlew ktlintCheck detekt

      - name: Android debug build
        run: ./gradlew :androidApp:assembleDebug
