name: iOS

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Shared core on the iOS simulator
        run: ./gradlew :shared:umbrella:assemble :shared:data:iosSimulatorArm64Test

      # XcodeBuildMCP is an agent-only tool, so CI drives Xcode directly.
      - name: iOS app build
        run: |
          xcodebuild \
            -project iosApp/Lockruna.xcodeproj \
            -scheme Lockruna \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            build
