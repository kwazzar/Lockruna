services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lockruna
      POSTGRES_PASSWORD: lockruna_password
      POSTGRES_DB: lockruna
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lockruna -d lockruna"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7-jammy
    environment:
      MONGO_INITDB_ROOT_USERNAME: lockruna
      MONGO_INITDB_ROOT_PASSWORD: lockruna_password
      MONGO_INITDB_DATABASE: lockruna_audit
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
