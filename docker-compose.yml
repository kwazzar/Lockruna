services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lockruna
      POSTGRES_PASSWORD: lockruna_password
      POSTGRES_DB: lockruna
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lockruna -d lockruna"]
      interval: 5s
      timeout: 5s
      retries: 5
